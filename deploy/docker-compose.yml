# Quappe — single-host deployment (Docker Compose).
#
# Runs the published Docker Hub images. Caddy terminates TLS (auto Let's Encrypt)
# and reverse-proxies to the web container. The service is internal-only (web
# proxies /api/* to it over the compose network). SQLite + the embedding-model
# cache live on a named volume so they survive restarts.
# Ollama provides LLM features (translation, reports, categorization).
# Watchtower auto-updates all containers hourly from Docker Hub.
#
# Usage:
#   cp .env.example .env   # then edit QUAPPE_SECRET
#   docker compose pull
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:3b  # once
#
# See ../README.md for the full DigitalOcean walkthrough.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  service:
    image: quappeorg/quappe-service:latest
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      QUAPPE_SECRET: ${QUAPPE_SECRET:?set QUAPPE_SECRET in .env}
      QUAPPE_DB_PATH: /data/quappe.db
      NODE_ENV: production
      PORT: "3000"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - quappe-data:/data
    expose:
      - "3000"

  web:
    image: quappeorg/quappe-web:latest
    restart: unless-stopped
    depends_on:
      - service
    environment:
      NODE_ENV: production
      PORT: "3000"
      PRIVATE_SERVICE_URL: http://service:3000
    expose:
      - "3000"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "3600"
      WATCHTOWER_CLEANUP: "true"

volumes:
  quappe-data:
  ollama-models:
  caddy-data:
  caddy-config:
